name: Deploy prototypes

# Source of truth: main → public/prototypes/**
# Merge/push to main publishes prototypes to the Hostinger VPS over SSH,
# and refreshes the slim deploy/prototypes branch.
on:
  push:
    branches: [main]
    paths:
      - 'public/prototypes/**'
      - '.github/workflows/deploy-prototypes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-prototypes
  cancel-in-progress: true

jobs:
  publish-deploy-branch:
    name: Update deploy/prototypes branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish deploy/prototypes branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK=$(mktemp -d)
          cp -R public/prototypes/. "$WORK/"
          cd "$WORK"
          git init -b deploy/prototypes
          git add .
          git commit -m "Deploy prototypes from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin deploy/prototypes

  ssh-to-vps:
    name: SSH sync to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check SSH secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PATH: ${{ secrets.HOSTINGER_SSH_PATH }}
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USERNAME}" ] || [ -z "${SSH_PATH}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing HOSTINGER_SSH_HOST / USERNAME / PATH — skipping VPS sync."
            exit 0
          fi
          if [ -z "${SSH_PASSWORD}" ] && [ -z "${SSH_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set HOSTINGER_SSH_PASSWORD or HOSTINGER_SSH_KEY — skipping VPS sync."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Upload public/prototypes to VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          source: "public/prototypes/*"
          target: ${{ secrets.HOSTINGER_SSH_PATH }}
          strip_components: 2
          overwrite: true
